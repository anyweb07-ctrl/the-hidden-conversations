
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Hidden Conversations</title>

<meta name="theme-color" content="#07172B">
<meta name="description" content="A private world for two.">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Georgia,serif;
}

body{
  min-height:100vh;
  min-height:100dvh;
  background:
    radial-gradient(circle at top,#183453 0%,#07172B 55%,#030b16 100%);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  color:#f5f0e6;
}

.login-card{
  width:100%;
  max-width:410px;
  padding:42px 30px;
  background:rgba(7,23,43,.92);
  border:1px solid #B89450;
  border-radius:18px;
  text-align:center;
  box-shadow:0 15px 55px rgba(0,0,0,.5);
  backdrop-filter:blur(12px);
}

.symbol{
  font-size:46px;
  color:#B89450;
  margin-bottom:18px;
}

h1{
  font-size:27px;
  font-weight:normal;
  color:#d5b675;
  margin-bottom:12px;
  line-height:1.3;
}

.subtitle{
  color:#aab5c4;
  font-size:12px;
  letter-spacing:2px;
  margin-bottom:35px;
}

.input-group{
  text-align:left;
  margin-bottom:17px;
}

label{
  display:block;
  color:#c4b58f;
  font-size:13px;
  margin-bottom:8px;
}

input{
  width:100%;
  padding:15px;
  background:#10253d;
  border:1px solid #34475c;
  border-radius:8px;
  color:white;
  outline:none;
  font-size:15px;
}

input:focus{
  border-color:#B89450;
  box-shadow:0 0 0 2px rgba(184,148,80,.12);
}

input::placeholder{
  color:#8290a3;
}

button{
  width:100%;
  padding:15px;
  background:#B89450;
  color:#07172B;
  border:none;
  border-radius:8px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  margin-top:12px;
  transition:.2s ease;
}

button:hover{
  background:#d5b675;
  transform:translateY(-1px);
}

button:disabled{
  opacity:.6;
  cursor:wait;
  transform:none;
}

#message{
  margin-top:20px;
  font-size:14px;
  color:#d5b675;
  min-height:20px;
  line-height:1.5;
  overflow-wrap:anywhere;
}

.footer{
  margin-top:35px;
  color:#718096;
  font-size:11px;
  letter-spacing:1.5px;
}

.security-note{
  color:#718096;
  font-size:11px;
  margin-top:14px;
}

@media(max-width:480px){
  .login-card{
    padding:35px 23px;
  }

  h1{
    font-size:24px;
  }
}
</style>
</head>

<body>

<main class="login-card">

  <div class="symbol">✦</div>

  <h1>The Hidden Conversations</h1>

  <p class="subtitle">A PRIVATE WORLD FOR TWO</p>

  <form id="loginForm">

    <div class="input-group">
      <label for="username">Username</label>

      <input
        type="text"
        id="username"
        placeholder="Enter your username"
        autocomplete="username"
        maxlength="24"
        required
      >
    </div>

    <div class="input-group">
      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
      >
    </div>

    <button type="submit" id="loginButton">
      Enter Private Space
    </button>

  </form>

  <p id="message" role="status" aria-live="polite"></p>

  <p class="security-note">
    Your private space awaits.
  </p>

  <div class="footer">
    PRIVATE • PERSONAL • SECURE
  </div>

</main>

<script>

// =====================================
// SUPABASE CONFIGURATION
// =====================================

const SUPABASE_URL =
"https://jjkrytylkxdxhvsybpdc.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_OJrh-S3KYeekZ28K-BE1xw_e1MXcbwq";

// =====================================
// TAB-BASED SESSION STORAGE
// =====================================

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY,
  {
    auth:{
      storage:window.sessionStorage,
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:false
    }
  }
);

// =====================================
// ELEMENTS
// =====================================

const form = document.getElementById("loginForm");
const message = document.getElementById("message");
const button = document.getElementById("loginButton");

// =====================================
// CHECK EXISTING SESSION
// =====================================

async function checkExistingSession(){

  try{

    const {data,error} =
      await supabaseClient.auth.getSession();

    if(error) throw error;

    if(!data.session) return;

    const {data:profile,error:profileError} =
      await supabaseClient
        .from("profiles")
        .select("role")
        .eq("id",data.session.user.id)
        .single();

    if(profileError || !profile){
      await supabaseClient.auth.signOut();
      return;
    }

    if(profile.role === "admin"){
      location.replace("admin.html");
    }else if(
      profile.role === "king" ||
      profile.role === "queen"
    ){
      location.replace("chat.html");
    }

  }catch(error){
    console.error("Session check:",error.message);
  }
}

// =====================================
// LOGIN SYSTEM
// =====================================

form.addEventListener("submit",async(event)=>{

  event.preventDefault();

  const username = document
    .getElementById("username")
    .value.trim()
    .toLowerCase();

  const password = document
    .getElementById("password")
    .value;

  if(!/^[a-zA-Z0-9_]{3,24}$/.test(username)){
    message.textContent = "Please enter a valid username.";
    return;
  }

  if(!password){
    message.textContent = "Please enter your password.";
    return;
  }

  button.disabled = true;
  button.textContent = "Please wait...";
  message.textContent = "Checking your account...";

  try{

    // USERNAME TO EMAIL

    let loginEmail;

    if(username === "admin"){
      loginEmail = "khushdonga7@gmail.com";
    }else{
      loginEmail =
        username + "@login.hidden-conversations.com";
    }

    // SUPABASE AUTHENTICATION

    const {data,error} =
      await supabaseClient.auth.signInWithPassword({
        email:loginEmail,
        password:password
      });

    if(error) throw error;

    // FETCH PROFILE

    const {data:profile,error:profileError} =
      await supabaseClient
        .from("profiles")
        .select("id,username,display_name,role")
        .eq("id",data.user.id)
        .single();

    if(profileError || !profile){

      await supabaseClient.auth.signOut();

      throw new Error(
        "Account profile not found. Please contact Admin."
      );
    }

    // VERIFY USERNAME

    if(
      !profile.username ||
      profile.username.toLowerCase() !== username
    ){

      await supabaseClient.auth.signOut();

      throw new Error(
        "Username does not match this account."
      );
    }

    // VERIFY ROLE

    if(!["admin","king","queen"].includes(profile.role)){

      await supabaseClient.auth.signOut();

      throw new Error("Invalid account role.");
    }

    // SUCCESS

    message.textContent =
      "Welcome, " +
      (profile.display_name || profile.username) +
      "! Redirecting...";

    button.textContent = "Opening Private Space...";

    const destination =
      profile.role === "admin"
        ? "admin.html"
        : "chat.html";

    location.replace(destination);

  }catch(error){

    message.textContent =
      error.message || "Login failed. Please try again.";

    button.textContent = "Enter Private Space";
    button.disabled = false;

  }

});

// =====================================
// START
// =====================================

checkExistingSession();

</script>

</body>
</html>
